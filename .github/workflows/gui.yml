name: GUI integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
          dotnet-quality: ga

      - name: Core at the pin
        run: |
          pin="$(cat CORE_VERSION)"
          git clone --branch "$pin" --depth 1 https://github.com/benmoussa-younes/core.git ../core
          test "$(git -C ../core describe --tags --exact-match)" = "$pin"

      - name: X11 libraries
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          xvfb x11-utils libx11-6 libice6 libsm6 libfontconfig1 libxext6
          libxrandr2 libxi6 libxcursor1

      - name: Publish
        run: >
          dotnet publish src/VpnManager.App/VpnManager.App.csproj
          -c Release -r linux-x64 -o publish

      - name: Self-test
        run: ./publish/vpn-manager --self-test

      - name: Real window under Xvfb
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/config" "$root/state" "$root/run"
          chmod 700 "$root" "$root/state" "$root/run"
          export XDG_CONFIG_HOME="$root/config"
          export XDG_STATE_HOME="$root/state"
          export XDG_RUNTIME_DIR="$root/run"
          xvfb-run -a sh -c '
            ./publish/vpn-manager &
            app=$!
            sleep 8
            window=$(xwininfo -root -tree | grep "VPN Manager" | head -1)
            test -n "$window"
            kill "$app" 2>/dev/null || true
            wait "$app" 2>/dev/null || true
          '
