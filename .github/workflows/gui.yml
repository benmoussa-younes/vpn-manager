name: GUI integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Core at the pin
        run: |
          pin="$(cat CORE_VERSION)"
          git clone --branch "$pin" --depth 1 https://github.com/benmoussa-younes/core.git ../core
          test "$(git -C ../core describe --tags --exact-match)" = "$pin"

      - name: X11 libraries
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          xvfb x11-utils libx11-6 libice6 libsm6 libfontconfig1 libxext6
          libxrandr2 libxi6 libxcursor1

      - name: Publish
        run: >
          dotnet publish src/VpnManager.App/VpnManager.App.csproj
          -c Release -r linux-x64 -o publish

      - name: Self-test
        run: ./publish/vpn-manager --self-test

      - name: Real window under Xvfb
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/config" "$root/state" "$root/run"
          chmod 700 "$root" "$root/state" "$root/run"
          export XDG_CONFIG_HOME="$root/config"
          export XDG_STATE_HOME="$root/state"
          export XDG_RUNTIME_DIR="$root/run"
          xvfb-run -a sh -c '
            ./publish/vpn-manager &
            app=$!
            sleep 8
            window=$(xwininfo -root -tree | grep "VPN Manager" | head -1)
            test -n "$window"
            kill "$app" 2>/dev/null || true
            wait "$app" 2>/dev/null || true
          '
