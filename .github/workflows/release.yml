name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
          dotnet-quality: ga

      - name: Core at the pin
        run: |
          pin="$(cat CORE_VERSION)"
          git clone --branch "$pin" --depth 1 https://github.com/benmoussa-younes/core.git ../core
          test "$(git -C ../core describe --tags --exact-match)" = "$pin"

      - name: Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev libfontconfig1

      - name: Licence
        run: pipx run reuse==5.0.2 lint

      - name: Build
        run: dotnet build VpnManager.slnx -c Release

      - name: Test
        run: dotnet test VpnManager.slnx -c Release --no-build

      - name: Verify tag matches VersionPrefix
        run: |
          version="$(dotnet msbuild src/VpnManager.App/VpnManager.App.csproj -getProperty:VersionPrefix -nologo)"
          test "$version" = "${TAG#v}"

      - name: Debian package
        run: packaging/build-deb.sh

      - name: Source archive
        run: |
          mkdir -p artifacts
          prefix="vpn-manager-${TAG}"
          git archive --format=tar.gz --prefix="${prefix}/" \
            -o "artifacts/${prefix}-src.tar.gz" HEAD
          (cd artifacts && sha256sum "${prefix}-src.tar.gz" > "${prefix}-src.tar.gz.sha256")

      - name: Checksums
        run: |
          cd artifacts
          sha256sum ./*.deb > SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "VPN Manager ${TAG}" \
              --generate-notes \
              artifacts/*
          fi
