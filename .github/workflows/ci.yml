name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  licence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Licence
        run: pipx run reuse==5.0.2 lint

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Core at the pin
        run: |
          pin="$(cat CORE_VERSION)"
          git clone --branch "$pin" --depth 1 https://github.com/benmoussa-younes/core.git ../core
          test "$(git -C ../core describe --tags --exact-match)" = "$pin"

      - name: Scripts interpreter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/scripts.tar.gz" \
            https://github.com/benmoussa-younes/scripts/releases/download/v0.2.1/scripts_0.2.1_linux-x64.tar.gz
          tar -xzf "$RUNNER_TEMP/scripts.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/scripts-0.2.1/scripts" /usr/local/bin/scripts

      - name: Gate dependencies
        run: |
          pipx install reuse==5.0.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gate
        run: scripts run tools/scripts/binaries/gate.scs

      - name: Restore
        run: dotnet restore VpnManager.slnx

      - name: Format
        run: dotnet format VpnManager.slnx --verify-no-changes --no-restore

      - name: Vulnerable packages
        run: |
          dotnet list VpnManager.slnx package --vulnerable --include-transitive --format json > vulnerabilities.json
          jq -e '[.. | .vulnerabilities? // empty | .[]] | length == 0' vulnerabilities.json

      - name: Build
        run: dotnet build VpnManager.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test VpnManager.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: D-Bus session dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus libglib2.0-bin

      - name: D-Bus integration
        run: >
          dbus-run-session -- dotnet test tests/VpnManager.App.Tests/VpnManager.App.Tests.csproj
          -c Release --no-build --filter FullyQualifiedName~DbusIntegrationTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          if-no-files-found: ignore
          retention-days: 7
          path: TestResults/*.trx
