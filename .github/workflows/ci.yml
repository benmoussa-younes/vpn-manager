name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-licence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
          dotnet-quality: ga

      - name: Core at the pin
        run: |
          pin="$(cat CORE_VERSION)"
          git clone --branch "$pin" --depth 1 https://github.com/benmoussa-younes/core.git ../core
          test "$(git -C ../core describe --tags --exact-match)" = "$pin"

      - name: Licence
        run: pipx run reuse==5.0.2 lint

      - name: Build
        run: dotnet build VpnManager.slnx -c Release

      - name: Test
        run: >
          dotnet test VpnManager.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: ignore
          path: TestResults/*.trx
