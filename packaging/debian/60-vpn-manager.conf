# NetworkManager gives a WireGuard full tunnel its default route through a
# dedicated routing table and two policy rules. The strict reverse path filter
# Debian ships then drops the peer's replies unless the kernel validates the
# source against the packet mark. wg-quick sets this itself; an
# `nmcli connection import` does not, so a full tunnel to a remote endpoint
# sends its handshakes and never receives a reply. The package sets it for every
# user, so the tunnel the application imports actually carries traffic.
net.ipv4.conf.all.src_valid_mark = 1
